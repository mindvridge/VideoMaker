[mutmut]
# Mutation testing configuration

# Paths to mutate
paths_to_mutate = app/

# Test runner command
runner = python -m pytest tests/ -x -q --tb=no

# Files to exclude from mutation
dict_synonyms = Struct, Config

# Timeout multiplier
test_time_multiplier = 2.0

# Maximum test time base in seconds
test_time_base = 30

# Number of parallel workers
parallel = true

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,build,dist,*.egg-info,venv,.venv,env,tests/
ignore = E203, E266, E501, W503

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 127
skip = venv,.venv,env,tests/

[black]
line-length = 127
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | tests
)/
'''

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
